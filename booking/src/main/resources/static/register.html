<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Hotel Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

        <header class="header">
        <a href="/about.html" class="logo">
            <span>Hotel Booking</span>
        </a>
        <nav>
            <a href="/about.html">Giới thiệu</a>
            <a href="/search.html">Tìm khách sạn</a>
            <a href="/login.html">Đăng nhập</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-title">
                <h1><i class="fa-solid fa-user-plus"></i> Tạo tài khoản</h1>
                <p>Đăng ký tài khoản để bắt đầu đặt phòng</p>
            </div>

            <form onsubmit="register(event)">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" id="name" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                </div>

                <button type="submit" class="auth-button"><i class="fa-solid fa-user-plus"></i> Đăng ký</button>
            </form>

            <div id="registerMessage" class="auth-message"></div>

            <div class="auth-footer">
                Đã có tài khoản?
                <a href="/login.html">Đăng nhập</a>
            </div>
        </div>
    </main>

    <script src="/js/auth.js?v=5"></script>
    <script src="/js/register.js"></script>

</body>

</html>
